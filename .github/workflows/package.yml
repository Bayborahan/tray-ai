name: Tray-AI Otomatik Linux Paketleyici

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Kodlari Cek
      uses: actions/checkout@v4

    - name: 2. Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Paketleme ve Vulkan Araclari
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm cmake git pkg-config \
                                libvulkan-dev vulkan-tools libcurl4-openssl-dev glslang-tools spirv-tools

        # glslc temini: Google shaderc resmi GitHub release ikilisini yukle
        echo ">>> glslc kuruluyor..."
        curl -sSL "https://github.com/google/shaderc/releases/download/v2024.1/glslc-linux-x86_64.tar.gz" -o /tmp/glslc.tar.gz || true
        
        if [ -s /tmp/glslc.tar.gz ] && tar -ztf /tmp/glslc.tar.gz >/dev/null 2>&1; then
          sudo tar -xzf /tmp/glslc.tar.gz -C /usr/local/bin/
          sudo chmod +x /usr/local/bin/glslc
        else
          echo ">>> Alternatif: glslangValidator wrapper glslc olarak olusturuluyor..."
          sudo bash -c 'cat << "SHIM" > /usr/local/bin/glslc
#!/usr/bin/env bash
args=()
output=""
for arg in "$@"; do
  if [ "$arg" == "-o" ]; then
    args+=("-o")
  else
    args+=("$arg")
  fi
done
exec glslangValidator -V "${args[@]}"
SHIM'
          sudo chmod +x /usr/local/bin/glslc
        fi

        # Dogrulama
        which glslc
        glslc --version || true

        sudo gem install --no-document fpm
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. llama-server Derle (Vulkan ve AVX2)
      run: |
        rm -rf /tmp/llama-build
        git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama-build
        cd /tmp/llama-build
        
        cmake -B build \
          -DBUILD_SHARED_LIBS=OFF \
          -DGGML_NATIVE=OFF \
          -DGGML_AVX2=ON \
          -DGGML_VULKAN=ON
          
        cmake --build build --config Release --target llama-server -j$(nproc)
        
        cd ${{ github.workspace }}
        mkdir -p engines
        cp -f /tmp/llama-build/build/bin/llama-server engines/llama-server
        cp -f /tmp/llama-build/build/bin/llama-server engines/llama-server-turboquant
        chmod +x engines/*
        rm -rf /tmp/llama-build
        echo "✅ Motor basariyla derlendi!"

    - name: 5. PyInstaller ile Paketle
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --name "tray-ai" \
          --add-data "assets:assets" \
          --add-data "core:core" \
          --add-data "ui:ui" \
          --add-data "engines:engines" \
          main.py

    - name: 6. Deb ve Rpm Paketlerini Olustur
      run: |
        mkdir -p package_root/opt/tray-ai
        mkdir -p package_root/usr/bin
        mkdir -p package_root/usr/share/applications
        mkdir -p package_root/usr/share/icons/hicolor/scalable/apps
        cp -r dist/tray-ai/* package_root/opt/tray-ai/
        ln -s /opt/tray-ai/tray-ai package_root/usr/bin/tray-ai
        if [ -f assets/tray-ai.svg ]; then
          cp assets/tray-ai.svg package_root/usr/share/icons/hicolor/scalable/apps/tray-ai.svg
        fi
        printf "[Desktop Entry]\nVersion=1.0\nType=Application\nName=Tray AI Server\nComment=Local GGUF LLM Server\nExec=/usr/bin/tray-ai\nIcon=tray-ai\nTerminal=false\nCategories=Development;Utility;\n" > package_root/usr/share/applications/tray-ai.desktop
        
        VERSION="1.0.0"
        if [ -n "${{ github.event.release.tag_name }}" ]; then
          RAW_VER="${{ github.event.release.tag_name }}"
          VERSION="${RAW_VER#v}"
        fi

        fpm -s dir -t deb -n tray-ai -v "$VERSION" \
          --description "Tray AI: Local GGUF LLM Server in System Tray" \
          --depends libxcb-cursor0 --depends libvulkan1 \
          -C package_root -p "tray-ai_${VERSION}_amd64.deb" .

        fpm -s dir -t rpm -n tray-ai -v "$VERSION" \
          --description "Tray AI: Local GGUF LLM Server in System Tray" \
          --depends xcb-util-cursor --depends vulkan-loader \
          -C package_root -p "tray-ai-${VERSION}.x86_64.rpm" .

    - name: 7. Paketleri Release'e Yukle
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          *.deb
          *.rpm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
