name: Tray-AI Otomatik Linux Paketleyici

on:
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - name: Kodları Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: PyInstaller ile İçine Göm ve Derle
      run: |
        pyinstaller --onefile --windowed main.py

    - name: AppImage Paketini Üret (Güvenli Yöntem)
      uses: AppImageCommunity/action-appimagetool@v1
      with:
        app_dir: 'dist'
        # dist klasörünün içindeki derlenmiş main dosyasını otomatik AppImage yapar
        entrypoint: 'main'

    - name: Deb ve Rpm Paketlerini Üret (FPM Aracı ile)
      run: |
        sudo apt-get update && sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
        sudo gem install --no-document fpm
        
        mkdir -p package_root/usr/bin
        cp dist/main package_root/usr/bin/tray-ai

        VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/v//')
        
        fpm -s dir -t deb -n tray-ai -v "$VERSION" -C package_root .
        fpm -s dir -t rpm -n tray-ai -v "$VERSION" -C package_root .

    - name: Paketleri GitHub Sürümüne (Release) Yükle
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.AppImage
          *.deb
          *.rpm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

